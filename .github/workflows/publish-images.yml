name: Publish pilot images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-pilot-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: site
            app: site
            dockerfile: Dockerfile
          - service: customer
            app: customer
            dockerfile: Dockerfile
          - service: api
            app: api
            dockerfile: Dockerfile
          - service: worker
            app: worker
            dockerfile: Dockerfile
          - service: ops
            app: ops
            dockerfile: Dockerfile.ops
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_API_URL=https://api.giromesa.com.br
            NEXT_PUBLIC_OPS_URL=https://app.giromesa.com.br
            NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=true
            NEXT_PUBLIC_CUSTOMER_API_URL=https://api.giromesa.com.br
            NEXT_PUBLIC_CUSTOMER_API_ENABLED=true
            VITE_API_URL=https://api.giromesa.com.br
            VITE_SITE_URL=https://giromesa.com.br
          tags: |
            ghcr.io/pendevtsp-star/giro-mesa-v2-${{ matrix.service }}:pilot
            ghcr.io/pendevtsp-star/giro-mesa-v2-${{ matrix.service }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
