name: CI

on:
  pull_request:
  push:
    branches: [main, release/rollback-0029]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: giromesa_ci
          POSTGRES_USER: giromesa
          POSTGRES_PASSWORD: giromesa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U giromesa -d giromesa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - name: Prepare integration databases
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U giromesa giromesa_management
          docker exec ${{ job.services.postgres.id }} createdb -U giromesa giromesa_growth
          docker exec ${{ job.services.postgres.id }} createdb -U giromesa giromesa_pilot
          docker exec ${{ job.services.postgres.id }} createdb -U giromesa giromesa_sync
          docker exec ${{ job.services.postgres.id }} createdb -U giromesa giromesa_worker
          docker exec ${{ job.services.postgres.id }} createdb -U giromesa giromesa_public
          for database in giromesa_ci giromesa_management giromesa_growth giromesa_pilot giromesa_sync giromesa_worker giromesa_public; do
            DATABASE_URL="postgresql://giromesa:giromesa@localhost:5432/$database" pnpm db:migrate
          done
      - name: Prove logical backup and restore
        run: |
          container="${{ job.services.postgres.id }}"
          docker exec "$container" pg_dump -U giromesa --no-owner --no-privileges giromesa_sync > /tmp/giromesa_sync.sql
          docker exec "$container" createdb -U giromesa giromesa_restore
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U giromesa -d giromesa_restore < /tmp/giromesa_sync.sql
          source_tables=$(docker exec "$container" psql -U giromesa -d giromesa_sync -tAc "select count(*) from information_schema.tables where table_schema = 'public'")
          restored_tables=$(docker exec "$container" psql -U giromesa -d giromesa_restore -tAc "select count(*) from information_schema.tables where table_schema = 'public'")
          source_migrations=$(docker exec "$container" psql -U giromesa -d giromesa_sync -tAc 'select count(*) from drizzle.__drizzle_migrations')
          restored_migrations=$(docker exec "$container" psql -U giromesa -d giromesa_restore -tAc 'select count(*) from drizzle.__drizzle_migrations')
          test "$source_tables" = "$restored_tables"
          test "$source_migrations" = "$restored_migrations"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://giromesa:giromesa@localhost:5432/giromesa_ci
          MANAGEMENT_DATABASE_URL: postgresql://giromesa:giromesa@localhost:5432/giromesa_management
          GROWTH_DATABASE_URL: postgresql://giromesa:giromesa@localhost:5432/giromesa_growth
          PILOT_DATABASE_URL: postgresql://giromesa:giromesa@localhost:5432/giromesa_pilot
          SYNC_DATABASE_URL: postgresql://giromesa:giromesa@localhost:5432/giromesa_sync
          WORKER_DATABASE_URL: postgresql://giromesa:giromesa@localhost:5432/giromesa_worker
          PUBLIC_ORDER_DATABASE_URL: postgresql://giromesa:giromesa@localhost:5432/giromesa_public
          AUTH_DATABASE_URL: postgresql://giromesa:giromesa@localhost:5432/giromesa_ci
      - run: pnpm build
      - name: Verify generated OpenAPI and TypeScript client
        run: |
          DATABASE_URL="postgresql://giromesa:giromesa@localhost:5432/giromesa_ci" SESSION_SECRET="ci-session-secret-at-least-32-characters" pnpm openapi:generate
          pnpm clients:generate:ts
          git diff --exit-code -- apps/api/openapi packages/contracts/src/generated-api.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm clients:generate:csharp
      - run: git diff --exit-code -- packages/api-client-csharp/Generated
      - run: dotnet restore apps/edge-hub/GiroMesa.EdgeHub.csproj
      - run: dotnet build apps/edge-hub/GiroMesa.EdgeHub.csproj --configuration Release --no-restore
      - run: dotnet test apps/edge-hub.tests/GiroMesa.EdgeHub.Tests.csproj --configuration Release
      - run: dotnet build packages/api-client-csharp/GiroMesa.ApiClient.csproj --configuration Release

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform

  release-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Reject repository secrets before privileged publication
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          dir --redact --no-banner /repo
      - name: Reject high or critical container definition findings
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro"
          aquasec/trivy:0.69.2@sha256:3d1f862cb6c4fe13c1506f96f816096030d8d5ccdb2380a3069f7bf07daa86aa
          fs --quiet --exit-code 1 --severity HIGH,CRITICAL
          --scanners vuln,misconfig /repo
      - name: Verify immutable supply-chain release contract
        run: node scripts/check-supply-chain.mjs

  recovery-publish:
    needs: [typescript, dotnet, terraform, release-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/rollback-0029'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: site, app: site, dockerfile: Dockerfile }
          - { service: customer, app: customer, dockerfile: Dockerfile }
          - { service: api, app: api, dockerfile: Dockerfile }
          - { service: worker, app: worker, dockerfile: Dockerfile }
          - { service: ops, app: ops, dockerfile: Dockerfile.ops }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v3.0.2
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_API_URL=https://api.giromesa.com.br
            NEXT_PUBLIC_OPS_URL=https://app.giromesa.com.br
            NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=true
            NEXT_PUBLIC_CUSTOMER_API_URL=https://api.giromesa.com.br
            NEXT_PUBLIC_CUSTOMER_API_ENABLED=true
            NEXT_PUBLIC_DEMO_HUB_ACK=false
            CUSTOMER_QA_DEMO_SLUG=demo
            VITE_API_URL=https://api.giromesa.com.br
            VITE_SITE_URL=https://giromesa.com.br
            VITE_DEMO_MODE=false
          tags: ghcr.io/pendevtsp-star/giro-mesa-v2-${{ matrix.service }}:recovery-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Sign exact recovery digest
        env:
          IMAGE: ghcr.io/pendevtsp-star/giro-mesa-v2-${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Create recovery digest fragment
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir fragment
          python3 - <<'PY'
          import json, os, pathlib, re
          digest, service, source = os.environ["DIGEST"], os.environ["SERVICE"], os.environ["SOURCE_SHA"]
          if service not in {"site", "customer", "api", "worker", "ops"}: raise SystemExit("invalid service")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest) or not re.fullmatch(r"[0-9a-f]{40}", source): raise SystemExit("invalid identity")
          pathlib.Path(f"fragment/{service}.json").write_text(json.dumps({"service":service,"digest":digest,"sourceCommit":source}, sort_keys=True, separators=(",", ":"))+"\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-digest-${{ matrix.service }}-${{ github.sha }}
          path: fragment/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 7

  recovery-release-manifest:
    needs: recovery-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/rollback-0029'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: recovery-digest-*-${{ github.sha }}
          path: fragments
          merge-multiple: true
      - name: Aggregate exact recovery release
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          source=os.environ["SOURCE_SHA"]
          entries=[json.loads(path.read_text(encoding="utf-8")) for path in pathlib.Path("fragments").glob("*.json")]
          expected={"site","customer","api","worker","ops"}
          if len(entries)!=5 or {item.get("service") for item in entries}!=expected or any(item.get("sourceCommit")!=source for item in entries): raise SystemExit("invalid recovery fragments")
          if any(not re.fullmatch(r"sha256:[0-9a-f]{64}", item.get("digest", "")) for item in entries): raise SystemExit("invalid recovery digest")
          images=[f"ghcr.io/pendevtsp-star/giro-mesa-v2-{item['service']}@{item['digest']}" for item in sorted(entries,key=lambda item:item["service"])]
          target=pathlib.Path(f"giromesa-image-attestation-{source}.json")
          target.write_text(json.dumps({"schemaVersion":1,"sourceCommit":source,"workflow":"ci.yml","images":images},sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          pathlib.Path(f"{target}.sha256").write_text(f"{hashlib.sha256(target.read_bytes()).hexdigest()}  {target.name}\n",encoding="ascii")
          PY
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v3.0.2
      - name: Sign recovery manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: cosign sign-blob --yes --bundle "giromesa-image-attestation-${SOURCE_SHA}.json.bundle" "giromesa-image-attestation-${SOURCE_SHA}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: giromesa-recovery-attestation-${{ github.sha }}
          path: giromesa-image-attestation-${{ github.sha }}.json*
          if-no-files-found: error
          retention-days: 90
