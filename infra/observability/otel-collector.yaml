extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  resource/giromesa:
    attributes:
      - key: service.namespace
        value: giromesa
        action: upsert
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: upsert
  attributes/redaction:
    actions:
      - key: authorization
        action: delete
      - key: cookie
        action: delete
      - key: set-cookie
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set_cookie
        action: delete
      - key: request.body
        action: delete
      - key: response.body
        action: delete
      - key: enduser.id
        action: delete
      - key: user.email
        action: delete
      - key: user.phone
        action: delete
      - key: payment.card.number
        action: delete
      - key: payment.card.cvv
        action: delete
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  otlphttp/upstream:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    timeout: 10s
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/giromesa, attributes/redaction, batch]
      exporters: [otlphttp/upstream]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/giromesa, batch]
      exporters: [otlphttp/upstream]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/giromesa, attributes/redaction, batch]
      exporters: [otlphttp/upstream]
  telemetry:
    logs:
      level: warn
