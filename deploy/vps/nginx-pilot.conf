map $http_upgrade $giromesa_connection_upgrade {
    default upgrade;
    '' close;
}

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

server {
    listen 80;
    listen [::]:80;
    server_name giromesa.com.br www.giromesa.com.br;

    location / {
        proxy_pass http://127.0.0.1:3110;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $giromesa_connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name menu.giromesa.com.br;

    location / {
        proxy_pass http://127.0.0.1:3111;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $giromesa_connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.giromesa.com.br;

    location / {
        proxy_pass http://127.0.0.1:3112;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.giromesa.com.br;
    client_max_body_size 20m;

    location = /api/v1/growth/evolution-go/webhook { return 404; }
    location = /v1/growth/evolution-go/webhook { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $giromesa_connection_upgrade;
        proxy_buffering off;
    }
}
