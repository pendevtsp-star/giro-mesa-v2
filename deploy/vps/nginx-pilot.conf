map $http_upgrade $giromesa_connection_upgrade {
    default upgrade;
    '' close;
}

# Cloudflare publishes the canonical origin ranges at https://www.cloudflare.com/ips/.
# Requests outside these ranges cannot choose CF-Connecting-IP.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.giromesa.com.br wss://api.giromesa.com.br; worker-src 'self' blob:; manifest-src 'self'; frame-src https://www.openstreetmap.org" always;

server {
    listen 80;
    listen [::]:80;
    server_name giromesa.com.br www.giromesa.com.br;

    location / {
        proxy_pass http://127.0.0.1:3110;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $giromesa_connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name menu.giromesa.com.br;

    location / {
        proxy_pass http://127.0.0.1:3111;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $giromesa_connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.giromesa.com.br;

    location / {
        proxy_pass http://127.0.0.1:3112;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.giromesa.com.br;
    client_max_body_size 20m;

    location = /api/v1/growth/evolution-go/webhook { return 404; }
    location = /v1/growth/evolution-go/webhook { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $giromesa_connection_upgrade;
        proxy_buffering off;
    }
}
