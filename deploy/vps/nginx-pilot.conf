map $http_upgrade $giromesa_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pilot.giromesa.com.br;

    location / {
        proxy_pass http://127.0.0.1:3110;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $giromesa_connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name menu-pilot.giromesa.com.br;

    location / {
        proxy_pass http://127.0.0.1:3111;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $giromesa_connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app-pilot.giromesa.com.br;

    location / {
        proxy_pass http://127.0.0.1:3112;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api-pilot.giromesa.com.br;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $giromesa_connection_upgrade;
        proxy_buffering off;
    }
}
