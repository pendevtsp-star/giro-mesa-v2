name: giromesa-v2-pilot

x-backend-service: &backend-service
  env_file:
    - ${GIROMESA_ENV_FILE:-/srv/apps/giromesa-v2/shared/.env}
  restart: unless-stopped
  networks:
    - giromesa-v2

x-web-service: &web-service
  restart: unless-stopped
  networks:
    - giromesa-v2

services:
  postgres:
    image: ${GIROMESA_POSTGRES_IMAGE:?GIROMESA_POSTGRES_IMAGE digest is provided by compose.images.yaml}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giromesa_v2}
      POSTGRES_USER: ${POSTGRES_USER:-giromesa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giromesa} -d ${POSTGRES_DB:-giromesa_v2}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - giromesa-v2

  evolution-db:
    image: ${GIROMESA_POSTGRES_IMAGE:?GIROMESA_POSTGRES_IMAGE digest is provided by compose.images.yaml}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:?EVOLUTION_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?EVOLUTION_POSTGRES_PASSWORD is required}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
      - ./evolution-init.sql:/docker-entrypoint-initdb.d/evolution-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - evolution-private

  evolution-go:
    image: evoapicloud/evolution-go:0.7.2@sha256:6fa601464bd76d3d19ece4c48d8bb5373d025d95d45b939ae4bf0c77b03f5aaa
    environment:
      SERVER_PORT: 4000
      CLIENT_NAME: GiroMesa
      GLOBAL_API_KEY: ${WHATSAPP_EVOLUTION_GLOBAL_API_KEY:?WHATSAPP_EVOLUTION_GLOBAL_API_KEY is required}
      POSTGRES_AUTH_DB: postgresql://${EVOLUTION_POSTGRES_USER}:${EVOLUTION_POSTGRES_PASSWORD}@evolution-db:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${EVOLUTION_POSTGRES_USER}:${EVOLUTION_POSTGRES_PASSWORD}@evolution-db:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      CONNECT_ON_STARTUP: "false"
      WEBHOOK_URL: ""
      WEBHOOK_FILES: "false"
      EVENT_IGNORE_GROUP: "true"
      EVENT_IGNORE_STATUS: "false"
      QRCODE_MAX_COUNT: "5"
      WADEBUG: INFO
      LOGTYPE: console
      MINIO_ENABLED: "false"
      OS_NAME: GiroMesa
      EVOLUTION_OPERATOR_EMAIL: ${EVOLUTION_OPERATOR_EMAIL:-}
    volumes:
      - evolution_data:/app/dbdata
    depends_on:
      evolution-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/server/ok >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - evolution-private

  clamav:
    image: ${GIROMESA_CLAMAV_IMAGE:?GIROMESA_CLAMAV_IMAGE digest is provided by compose.images.yaml}
    environment:
      FRESHCLAM_CHECKS: ${CLAMAV_FRESHCLAM_CHECKS:-4}
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc -w 5 127.0.0.1 3310 | grep -qx PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 6m
    restart: unless-stopped
    networks:
      - giromesa-v2

  migrate:
    <<: *backend-service
    image: ${GIROMESA_IMAGE_PREFIX:-ghcr.io/pendevtsp-star/giro-mesa-v2}-api:${GIROMESA_IMAGE_TAG:-pilot}
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: [tools]

  api:
    <<: *backend-service
    image: ${GIROMESA_IMAGE_PREFIX:-ghcr.io/pendevtsp-star/giro-mesa-v2}-api:${GIROMESA_IMAGE_TAG:-pilot}
    environment:
      HOST: 0.0.0.0
      PORT: 3200
      BUILD_SHA: ${GIROMESA_RELEASE_ARTIFACT_SHA:-local}
      EDGE_HUB_WINDOWS_INSTALLER_URL: ${EDGE_HUB_WINDOWS_INSTALLER_URL:-}
      MEDIA_ROOT: /app/data/media
      ACCOUNTANT_ATTACHMENT_SCAN_MODE: ${ACCOUNTANT_ATTACHMENT_SCAN_MODE:-clamd}
      ACCOUNTANT_ATTACHMENT_CLAMD_HOST: ${ACCOUNTANT_ATTACHMENT_CLAMD_HOST:-clamav}
      ACCOUNTANT_ATTACHMENT_CLAMD_PORT: ${ACCOUNTANT_ATTACHMENT_CLAMD_PORT:-3310}
      ACCOUNTANT_ATTACHMENT_SCAN_TIMEOUT_MS: ${ACCOUNTANT_ATTACHMENT_SCAN_TIMEOUT_MS:-10000}
      ACCOUNTANT_ATTACHMENT_RETENTION_DAYS: ${ACCOUNTANT_ATTACHMENT_RETENTION_DAYS:-1827}
    volumes:
      - media_data:/app/data/media
    networks:
      - giromesa-v2
      - evolution-private
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:3210:3200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *backend-service
    image: ${GIROMESA_IMAGE_PREFIX:-ghcr.io/pendevtsp-star/giro-mesa-v2}-worker:${GIROMESA_IMAGE_TAG:-pilot}
    environment:
      MEDIA_ROOT: /app/data/media
      WORKER_HEARTBEAT_FILE: ${WORKER_HEARTBEAT_FILE:-/tmp/giromesa-worker-heartbeat}
      WORKER_HEARTBEAT_MAX_AGE_MS: ${WORKER_HEARTBEAT_MAX_AGE_MS:-30000}
      WORKER_HEARTBEAT_CLEANUP_ON_SHUTDOWN: ${WORKER_HEARTBEAT_CLEANUP_ON_SHUTDOWN:-false}
    volumes:
      - media_data:/app/data/media
    networks:
      - giromesa-v2
      - evolution-private
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "apps/backends/worker/dist/worker-healthcheck.js"]
      interval: ${WORKER_HEARTBEAT_CHECK_INTERVAL:-10s}
      timeout: 5s
      retries: 3
      start_period: 30s

  site:
    <<: *web-service
    image: ${GIROMESA_IMAGE_PREFIX:-ghcr.io/pendevtsp-star/giro-mesa-v2}-site:${GIROMESA_IMAGE_TAG:-pilot}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.giromesa.com.br}
      NEXT_PUBLIC_OPS_URL: ${NEXT_PUBLIC_OPS_URL:-https://app.giromesa.com.br}
      NEXT_PUBLIC_REDE_STORE_URL: ${NEXT_PUBLIC_REDE_STORE_URL:-}
      NEXT_PUBLIC_PAYGO_STORE_URL: ${NEXT_PUBLIC_PAYGO_STORE_URL:-}
      NEXT_PUBLIC_STONE_STORE_URL: ${NEXT_PUBLIC_STONE_STORE_URL:-}
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-true}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3110:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  customer:
    <<: *web-service
    image: ${GIROMESA_IMAGE_PREFIX:-ghcr.io/pendevtsp-star/giro-mesa-v2}-customer:${GIROMESA_IMAGE_TAG:-pilot}
    environment:
      NEXT_PUBLIC_CUSTOMER_API_URL: ${NEXT_PUBLIC_CUSTOMER_API_URL:-https://api.giromesa.com.br}
      NEXT_PUBLIC_CUSTOMER_API_ENABLED: ${NEXT_PUBLIC_CUSTOMER_API_ENABLED:-true}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3111:3101"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  ops:
    image: ${GIROMESA_IMAGE_PREFIX:-ghcr.io/pendevtsp-star/giro-mesa-v2}-ops:${GIROMESA_IMAGE_TAG:-pilot}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3112:8080"
    networks:
      - giromesa-v2

volumes:
  postgres_data:
  clamav_data:
  media_data:
  evolution_postgres_data:
  evolution_data:

networks:
  giromesa-v2:
    name: giromesa-v2-pilot
  evolution-private:
    name: giromesa-v2-evolution-private
    internal: true
