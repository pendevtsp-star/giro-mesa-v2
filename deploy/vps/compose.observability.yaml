services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
    depends_on:
      otel-collector:
        condition: service_started

  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:09f7a495e6542343cc25aa4e3facba144ba03b0f0b030e4469186e8164a9ed64
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    labels:
      giromesa.observability.durability: "none"
      giromesa.observability.purpose: "debug-only"
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
    configs:
      - source: otel_debug_config
        target: /etc/otelcol-contrib/config.yaml
    restart: unless-stopped
    networks:
      - giromesa-v2

configs:
  otel_debug_config:
    file: ../../infra/observability/otel-collector.debug.yaml
