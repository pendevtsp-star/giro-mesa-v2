packages:
  - apps/frontends/*
  - apps/backends/*
  - apps/native/*
  - packages/*

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  argon2: true
  core-js: false
  esbuild: true
  protobufjs: false

onlyBuiltDependencies:
  - '@nestjs/core'
  - argon2
  - esbuild
  - sharp

overrides:
  esbuild: 0.28.2
  fastify: 5.12.5
  find-my-way: 9.7.0
  sharp: 0.35.5
  "brace-expansion@>=2.0.0 <3.0.0": 2.1.7
  source-map-js: 1.2.2
  dompurify: 3.4.16
  "fast-uri@>=3.0.0 <4.0.0": 3.1.8
  "fast-uri@>=4.0.0 <5.0.0": 4.2.1
  "@nestjs/swagger>js-yaml": 5.4.1
  "@redocly/openapi-core>js-yaml": 4.3.2
