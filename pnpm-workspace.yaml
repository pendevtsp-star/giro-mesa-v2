packages:
  - apps/frontends/*
  - apps/backends/*
  - apps/native/*
  - packages/*

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  argon2: true
  core-js: false
  esbuild: true
  protobufjs: false

onlyBuiltDependencies:
  - '@nestjs/core'
  - argon2
  - esbuild
  - sharp

overrides:
  esbuild: 0.28.2
  fastify: 5.12.1
  find-my-way: 9.7.0
  "fast-uri@>=3.0.0 <4.0.0": 3.1.6
  "fast-uri@>=4.0.0 <5.0.0": 4.1.3
  "@nestjs/swagger>js-yaml": 5.2.3
  "@redocly/openapi-core>js-yaml": 4.3.1
