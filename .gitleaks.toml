title = "GiroMesa gitleaks policy"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic credentials for the localhost-only unified service test"
regexTarget = "secret"
regexes = [
  '''^unified-e2e-internal-key$''',
  '''^unified-e2e-qr-secret-at-least-32-bytes$''',
]

[[allowlists]]
description = "Known synthetic Stripe-shaped redaction fixture"
regexTarget = "secret"
regexes = ['''^sk_live_1234567890abcdef$''']

[[allowlists]]
description = "Known non-secret storage and idempotency identifiers"
regexTarget = "secret"
regexes = [
  '''^giromesa_operational_scope_v1$''',
  '''^delivery-assign-1$''',
  '''^delivery-notification-1$''',
  '''^delivery-fulfillment-mismatch-0001$''',
  '''^commission-idempotency-1$''',
]
