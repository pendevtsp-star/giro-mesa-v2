<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#146b4c" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/giromesa-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="GiroMesa — operação de salão, balcão e gestão." />
    <title>GiroMesa Operação</title>
    <script>
      if (window.location.hostname === "0.0.0.1" && !window.HybridWebView) {
        const bridgeScript = document.createElement("script");
        bridgeScript.src = "_framework/hybridwebview.js";
        bridgeScript.onload = () => window.dispatchEvent(new Event("GiroMesaHybridWebViewReady"));
        document.head.appendChild(bridgeScript);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
